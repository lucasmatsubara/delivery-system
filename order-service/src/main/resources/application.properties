spring.application.name=order-service

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

spring.cloud.loadbalancer.cache.ttl=5s

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=myuser
spring.rabbitmq.password=secret

spring.datasource.url=jdbc:h2:mem:orderdb;LOCK_TIMEOUT=60000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=60000
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY:}

spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.model=${AI_MODEL:gpt-5-mini}

delivery.rate-limit.enabled=true
delivery.rate-limit.requests-per-second=20
